name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build Docker image with specific tag
        run: |
          docker build -t elblogbruno/hvac-log680-eq12:${{ github.sha }} .
          
      - name: Publish Docker image with specific tag to Docker Hub
        run: |
          docker push elblogbruno/hvac-log680-eq12:${{ github.sha }}
          
      - name: Tag Docker image as latest
        run: |
          docker tag elblogbruno/hvac-log680-eq12:${{ github.sha }} elblogbruno/hvac-log680-eq12:latest
          
      - name: Publish Docker image with latest tag to Docker Hub
        run: |
          docker push elblogbruno/hvac-log680-eq12:latest
  deploy:
    name: Deploy
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name : set context
        uses : Azure/k8s-set-context@v2
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
          
      - name: delete previous deployment if exists
        run: |
          kubectl delete deployment hvac-server
        continue-on-error: true
        
      - name: deploy image to Kubernetes cluster
        id: createDeployment
        run: |
            kubectl create -f ./kubernetes/deployment.yaml
        
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: 'Image {{ github.sha }} déployée sur le cluster Kubernetes sous le nom : hvac-server.'
